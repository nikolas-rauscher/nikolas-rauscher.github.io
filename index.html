<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Nikolas Rauscher’s academic homepage.">
  <meta name="color-scheme" content="light">
  <title>Nikolas Rauscher</title>
  <style>
    :root { color-scheme: only light; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: #252b2e; font: 1rem/1.6 system-ui, sans-serif; }
    main { max-width: 42rem; margin: clamp(3.5rem, 11vw, 7rem) auto 4rem; padding: 0 1.5rem; }
    header { margin-bottom: 3rem; }
    h1 { margin: 0 0 .45rem; font-size: clamp(2rem, 7vw, 3rem); line-height: 1.15; letter-spacing: -.04em; }
    h2 { margin: 0 0 .35rem; font-size: 1.15rem; }
    p { margin: 0; color: #4b555b; }
    section { border-top: 1px solid #d9dfe2; padding: 1rem 0 1.2rem; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Nikolas Rauscher</h1>
      <p>Computer science master’s student at TU Berlin</p>
    </header>
    <section aria-labelledby="publications">
      <h2 id="publications">Publications</h2>
      <p>Coming soon.</p>
    </section>
    <section aria-labelledby="projects">
      <h2 id="projects">Projects</h2>
      <p>Coming soon.</p>
    </section>
  </main>
</body>
</html>
